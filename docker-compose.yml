services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [backend]
